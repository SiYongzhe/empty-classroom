<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>空教室查询 · Axiom 黑客松 2026</title>
  <meta name="description" content="选时间和楼栋，看哪间教室现在空着、能连空几节。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ccircle cx='32' cy='24' r='6' fill='white'/%3E%3Cpath d='M18 44h28' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">空</span>
      <div>
        <h1>空教室查询</h1>
        <p class="sub" id="clockText">正在读取时间…</p>
      </div>
    </div>
    <button id="settingsBtn" class="ghost" type="button">AI 设置</button>
  </header>

  <main>
    <!-- 控制区：哪天、哪一节、哪栋楼 -->
    <section class="panel">
      <div class="panel-row">
        <div class="seg" id="daySeg">
          <button class="seg-btn is-on" data-day="0" type="button">今天</button>
          <button class="seg-btn" data-day="1" type="button">明天</button>
        </div>
        <span class="tip" id="autoTip"></span>
      </div>

      <div class="periods" id="periodRow"></div>

      <div class="panel-row wrap">
        <div class="chips" id="buildingRow"></div>
        <input
          id="search"
          class="search"
          type="search"
          placeholder="搜教室号，如 WLA-310"
          autocomplete="off"
        />
      </div>
    </section>

    <div class="summary">
      <span id="summaryText">—</span>
      <button id="favToggle" class="ghost small" type="button">☆ 只看收藏</button>
    </div>

    <section id="roomGrid" class="grid" aria-live="polite"></section>

    <!-- AI 推荐 -->
    <section class="panel">
      <h2>让 AI 帮我挑一间</h2>
      <p class="hint">说说你的偏好：安静、有插座、能坐 6 个人…</p>
      <div class="ai-row">
        <input id="need" type="text" placeholder="例如：安静、有插座、能坐 4 个人" maxlength="60" autocomplete="off" />
        <button id="aiBtn" class="primary" type="button">推荐</button>
      </div>
      <div id="aiOut" class="ai-out" hidden></div>
    </section>
  </main>

  <footer class="foot">
    数据为模拟数据，用于演示；真实排课需要教务接口权限。
    <span class="ver">v2.0 · 2026-10-29</span>
  </footer>

  <!-- 教室详情：点卡片打开，看这间今天全天什么时候空 -->
  <div id="detailModal" class="modal" hidden>
    <div class="modal-box detail-box" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <h3 id="detailTitle">教室</h3>
        <button id="detailClose" class="ghost small" type="button">关闭</button>
      </div>

      <div id="detailMeta" class="detail-meta"></div>
      <div id="detailTags" class="tags"></div>

      <h4 class="detail-sub">今天</h4>
      <div id="detailToday" class="timeline"></div>

      <h4 class="detail-sub">明天</h4>
      <div id="detailTomorrow" class="timeline"></div>

      <div class="detail-foot">
        <button id="detailFav" class="ghost" type="button">☆ 收藏</button>
        <span class="detail-hint">绿色=空着，灰色=有课</span>
      </div>
    </div>
  </div>

  <!-- AI 设置弹层 -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">连接 AI 接口</h3>
      <p class="hint">
        默认填 DeepSeek 的兼容接口。Key 只存本机浏览器，<strong>不要写进代码、也不要发给别人</strong>。
        留空则用「本地推荐」，不联网也能演示。
      </p>

      <label class="field">
        <span>接口地址</span>
        <input id="cfgEndpoint" type="text" placeholder="https://api.deepseek.com/chat/completions" />
      </label>

      <label class="field">
        <span>模型名</span>
        <input id="cfgModel" type="text" placeholder="deepseek-chat" />
      </label>

      <label class="field">
        <span>API Key</span>
        <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off" />
      </label>

      <div class="modal-actions">
        <button id="settingsCancel" class="ghost" type="button">取消</button>
        <button id="settingsSave" class="primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="assets/core.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
