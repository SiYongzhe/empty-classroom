<!DOCTYPE html>
<!-- 这是一个"最小网页"：整个网站只有这一个文件。
     它把 HTML / CSS / JS 三种东西塞在一起，方便你一眼看出分工。
     对比 axiom-starter/index.html：那边只是把三者拆成了三个文件而已。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>最小网页</title>

  <!-- ===== 2. CSS：决定"长什么样"（颜色、大小、位置） ===== -->
  <style>
    body { font-family: sans-serif; background: #eef0fb; text-align: center; padding-top: 80px; }
    h1   { color: #5b5bd6; font-size: 28px; }
    button {
      padding: 10px 18px; font-size: 15px; cursor: pointer;
      border: 1px solid #c9cbe0; border-radius: 10px; background: #fff;
    }
  </style>
</head>
<body>
  <!-- ===== 1. HTML：决定"有什么"（文字、按钮、输入框） ===== -->
  <h1 id="title">你好，这是我的第一个网页</h1>
  <button id="btn">点我</button>

  <!-- ===== 3. JS：决定"能做什么"（点击后发生什么） ===== -->
  <script>
    let count = 0;
    document.getElementById("btn").onclick = function () {
      count = count + 1;
      document.getElementById("title").textContent = "你点了 " + count + " 次";
    };
  </script>
</body>
</html>
